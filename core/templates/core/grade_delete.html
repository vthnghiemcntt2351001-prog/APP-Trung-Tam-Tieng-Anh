
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa điểm</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 30px; }
        .container { max-width: 550px; margin: 60px auto; background: white; padding: 25px; border-radius: 10px; }
        h1 { color: #dc3545; }
        button, a { display: inline-block; padding: 10px 15px; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; margin-top: 15px; }
        button { background: #dc3545; color: white; }
        a { background: #6c757d; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1>Xác nhận xóa điểm</h1>

    <p>Bạn có chắc chắn muốn xóa kết quả điểm của học viên này không?</p>

    <p><strong>Học viên:</strong> {{ grade.student.full_name }}</p>
    <p><strong>Lớp học:</strong> {{ grade.english_class.name }}</p>
    <p><strong>Điểm trung bình:</strong> {{ grade.average_score }}</p>
    <p><strong>Ngày kiểm tra:</strong> {{ grade.exam_date|date:"d/m/Y" }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Xác nhận xóa</button>
        <a href="{% url 'grade_list' %}">Hủy</a>
    </form>
</div>
</body>
</html>
