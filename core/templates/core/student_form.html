
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | EnglishCenter</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0000000d;
        }
        h2 { color: #173b70; }
        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }
        textarea { min-height: 85px; }
        .btn {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 17px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }
        .back { background: #e2e8f0; color: #1e293b; }
    </style>
</head>
<body>
<div class="container">
    <h2>{{ title }}</h2>

    <form method="post">
        {% csrf_token %}

        <label>Họ và tên *</label>
        <input type="text" name="full_name"
               value="{{ student.full_name|default:'' }}" required>

        <label>Email *</label>
        <input type="email" name="email"
               value="{{ student.email|default:'' }}" required>

        <label>Số điện thoại *</label>
        <input type="text" name="phone"
               value="{{ student.phone|default:'' }}" required>

        <label>Ngày sinh</label>
        <input type="date" name="date_of_birth"
               value="{{ student.date_of_birth|date:'Y-m-d'|default:'' }}">

        <label>Địa chỉ</label>
        <textarea name="address">{{ student.address|default:'' }}</textarea>

        <button class="btn" type="submit">Lưu thông tin</button>
        <a class="btn back" href="{% url 'student_list' %}">Quay lại</a>
    </form>
</div>
</body>
</html>
