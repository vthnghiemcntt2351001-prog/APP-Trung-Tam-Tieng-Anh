
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa lớp học</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 25px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        h1 { color: #1f3c88; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button, .btn { display: inline-block; margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 5px; color: white; text-decoration: none; cursor: pointer; }
        button { background: #ea580c; }
        .btn { background: #64748b; }
        .message { background: #fee2e2; padding: 10px; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>SỬA LỚP HỌC</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Tên lớp *</label>
        <input type="text" name="name"
               value="{{ request.POST.name|default:english_class.name }}" required>

        <label>Khóa học *</label>
        <select name="course" required>
            {% for course in courses %}
                <option value="{{ course.id }}"
                    {% if request.POST.course %}
                        {% if request.POST.course == course.id|stringformat:"s" %}selected{% endif %}
                    {% elif english_class.course_id == course.id %}
                        selected
                    {% endif %}>
                    {{ course.name }}
                </option>
            {% endfor %}
        </select>

        <label>Giáo viên phụ trách</label>
        <select name="teacher">
            <option value=""
                {% if not english_class.teacher_id and not request.POST.teacher %}selected{% endif %}>
                -- Chưa phân công --
            </option>
            {% for teacher in teachers %}
                <option value="{{ teacher.id }}"
                    {% if request.POST.teacher %}
                        {% if request.POST.teacher == teacher.id|stringformat:"s" %}selected{% endif %}
                    {% elif english_class.teacher_id == teacher.id %}
                        selected
                    {% endif %}>
                    {{ teacher.full_name }} - {{ teacher.specialization|default:"Chưa có chuyên môn" }}
                </option>
            {% endfor %}
        </select>

        <label>Ngày bắt đầu *</label>
        <input type="date" name="start_date"
               value="{{ request.POST.start_date|default:english_class.start_date|date:'Y-m-d' }}" required>

        <label>Ngày kết thúc</label>
        <input type="date" name="end_date"
               value="{{ request.POST.end_date|default:english_class.end_date|date:'Y-m-d' }}">

        <label>Sĩ số tối đa *</label>
        <input type="number" name="max_students" min="1"
               value="{{ request.POST.max_students|default:english_class.max_students }}" required>

        <button type="submit">Cập nhật lớp học</button>
        <a class="btn" href="{% url 'class_list' %}">Quay lại</a>
    </form>
</div>
</body>
</html>
